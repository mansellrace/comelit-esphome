# Comelit intercom - Home Assistant interface
# https://github.com/mansellrace/comelit-esphome
#
# This is the configuration your device shipped with. Everything below is yours
# to change: rename the entities, delete the ones you do not use, add as many
# binary sensors and buttons as your installation needs.
#
# The options of the comelit_intercom component are documented here:
# https://github.com/mansellrace/comelit-esphome/blob/main/components/README.md

esphome:
  name: comelit-default
  friendly_name: Comelit
  comment: "Use this page to see the commands received from the bus"

esp8266:
  board: d1_mini
  restore_from_flash: true
  
preferences:
  flash_write_interval: 0s
  
logger:

# homeassistant_services is required: the component fires events through the
# Home Assistant API.
api:
  homeassistant_services: true

ota:
  - platform: esphome
  - platform: web_server

# Wi-Fi credentials are the ones you entered in the captive portal when you
# first set the device up, and they are kept in flash. If you prefer to have
# them in this file, add ssid and password here.
wifi:
  ap:
    ap_timeout: 10s
  min_auth_mode: WPA2

captive_portal:

web_server:
  version: 3

# refresh is explicit on purpose. Without it the github:// clone is cached for a
# whole day, so a device adopted right after a push validates against the previous
# state of the repo and fails on anything newly added.
external_components:
  - source: github://mansellrace/comelit-esphome
    refresh: 2min

comelit_intercom:
  hw_version: "2.6"

# The address your intercom answers to. You set it from Home Assistant, and the
# entities below pick it up straight away -- no recompiling needed.
# If you would rather hard-code the address, delete this number and write the
# plain value in the entities instead.
number:
  - platform: template
    id: comelit_address
    name: "Intercom address"
    icon: mdi:numeric
    optimistic: true
    restore_value: true
    initial_value: 1
    min_value: 1
    max_value: 255
    step: 1
    mode: box

# Turns on when someone calls your intercom (command 50 is the default).
# Add more of these to react to other commands, for example a door being opened.
binary_sensor:
  - platform: comelit_intercom
    name: "Incoming call"
    address: !lambda 'return (uint16_t) id(comelit_address).state;'

# What the device comment above points at: the last command seen on the bus,
# written as C<command>_A<address>. It goes back to empty after 10 seconds.
text_sensor:
  - platform: comelit_intercom
    name: "Last command"
    auto_clear: 0s

# Fires on every command addressed to your intercom, with the command number as
# the event type. Unlike the binary sensor it fires again when the very same
# command is received twice in a row.
# event:
#   - platform: comelit_intercom
#     name: "Intercom event"
#     address: !lambda 'return (uint16_t) id(comelit_address).state;'

# Command 16 opens the main door on most installations. Command 29 is the
# secondary door or a generic actuator. Chained sends need a 200ms delay
# between them.
button:
  - platform: template
    name: Open Door
    on_press:
      - comelit_intercom.send:
          command: 16
          address: 1

  - platform: template
    name: Open Secondary Door
    on_press:
      - comelit_intercom.send:
          command: 19
          address: 1
      - delay: 200ms
      - comelit_intercom.send:
          command: 16
          address: 1
